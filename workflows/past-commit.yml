name: Create one past-dated commit
on:
  workflow_dispatch:

jobs:
  make-past-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Make a tiny change
        run: |
          # burada oluşturulacak/grep edilecek dosya adı
          FILE=past-commit.txt
          # dosya yoksa oluştur, varsa sonuna küçük bir satır ekle
          echo "commit created by workflow at $(date)" >> $FILE
          git add $FILE

      - name: Commit with past date and push
        env:
          # Buraya göstermek istediğin tarihi gir (RFC3339 veya "YYYY-MM-DDTHH:MM:SS")
          PAST_DATE: "2025-10-10T12:40:00"
          # isteğe bağlı: commit'i hangi isim/email ile göstermek istersen
          AUTHOR_NAME: "idilir"
          AUTHOR_EMAIL: "your-email@example.com"
        run: |
          git config user.name "${AUTHOR_NAME}"
          git config user.email "${AUTHOR_EMAIL}"
          export GIT_AUTHOR_DATE="${PAST_DATE}"
          export GIT_COMMITTER_DATE="${PAST_DATE}"
          # commit mesajını istersen değiştir
          git commit -m "Create past-dated commit via Actions" --date "${PAST_DATE}"
          git push origin HEAD:main
